# Local/dev stack. Production settings are a separate concern (H08).

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: travelx_app:local
  env_file:
    - .env
  volumes:
    - .:/app
  networks:
    - travelx_network

services:

  db:
    image: postgres:15
    container_name: travelx_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelx_db}
      POSTGRES_USER: ${POSTGRES_USER:-travelx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelx_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - travelx_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travelx_redis
    ports:
      - "6379:6379"
    networks:
      - travelx_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: travelx_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - travelx_network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: travelx_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - travelx_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: applies migrations once, before anything that needs the schema
  # (web, Celery, beat's django_celery_beat tables, consumer, relay).
  migrate:
    <<: *app
    container_name: travelx_migrate
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    container_name: travelx_web
    command: >
      sh -c "rm -rf \"$$PROMETHEUS_MULTIPROC_DIR\" &&
             mkdir -p \"$$PROMETHEUS_MULTIPROC_DIR\" &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    environment:
      # H05: several gunicorn workers need a shared, freshly cleaned directory.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # H02 liveness endpoint. Needs "localhost" in ALLOWED_HOSTS (the default has it).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery_worker:
    <<: *app
    container_name: travelx_celery_worker
    command: celery -A config worker -l info --concurrency 4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *app
    container_name: travelx_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  kafka_consumer:
    <<: *app
    container_name: travelx_kafka_consumer
    command: python manage.py run_consumer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # G08: moves booking events from the database outbox to Kafka.
  # Without this service, bookings are saved but their events never leave the DB.
  outbox_relay:
    <<: *app
    container_name: travelx_outbox_relay
    command: python manage.py publish_outbox
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

